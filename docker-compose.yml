
services:
  spectra-frontend:
    build:
      context: ./frontend/Spectra-Frontend
    container_name: spectra-dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_DRIVER_APP_URL: http://localhost:5174
      VITE_EMAIL_APP_URL: http://localhost:5175
      VITE_DRIVER_API_URL: http://127.0.0.1:8001
      VITE_EMAIL_API_URL: http://127.0.0.1:8002
    restart: unless-stopped

  drowsy-frontend:
    build:
      context: ./frontend/drowsy-frontend
    container_name: spectra-driver-frontend
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://127.0.0.1:8001
      VITE_SPECTRA_URL: http://localhost:5173
    restart: unless-stopped

  email-frontend:
    build:
      context: ./frontend/mail_detection-frontend
    container_name: spectra-email-frontend
    ports:
      - "5175:5175"
    environment:
      VITE_SPECTRA_URL: http://localhost:5173
    restart: unless-stopped

  email-backend:
    build:
      context: ./backend/mail_detection-backend
    container_name: spectra-email-backend
    ports:
      - "8002:8002"
    restart: unless-stopped

  drowsy-backend:
    build:
      context: ./backend/drowsy-backend
    container_name: spectra-drowsy-backend
    ports:
      - "8001:8001"
    restart: unless-stopped